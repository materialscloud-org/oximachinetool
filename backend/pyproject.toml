[project]
name = "oximachine-api"
version = "2.0.0.dev0"
description = "oxiMACHINE backend: predict oxidation states of metal sites in MOFs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "pymatgen>=2024.8",
  "oximachine-featurizer==0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oximachine_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
